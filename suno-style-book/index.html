<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suno スタイル帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column workbench — search bar on top, genre chips, a stack of style cards; a second tab holds the lyrics formatter */
:root{
  --bg:#f3f2f7; --surface:#ffffff; --sunk:#ecebf2; --ink:#1c1a25; --muted:#5d586c; --line:#d9d6e3;
  --accent:#5b2bc4; --accent-soft:#ece5fb; --on-accent:#ffffff; --ok:#1d7a4b; --warn:#a4501a;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13111a; --surface:#1c1926; --sunk:#16141e; --ink:#ebe8f3; --muted:#a39db5; --line:#302b3f;
  --accent:#a68bff; --accent-soft:#2a2242; --on-accent:#15121e; --ok:#5fd39a; --warn:#f0a36c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13111a; --surface:#1c1926; --sunk:#16141e; --ink:#ebe8f3; --muted:#a39db5; --line:#302b3f;
  --accent:#a68bff; --accent-soft:#2a2242; --on-accent:#15121e; --ok:#5fd39a; --warn:#f0a36c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,34px);margin:0;letter-spacing:.02em;line-height:1.1}
h1 small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);letter-spacing:0;margin-top:6px;font-weight:500}
.tabs{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:4px}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:8px 14px;border-radius:7px;cursor:pointer;min-height:40px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.search{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:8px 0;outline:none}
.count{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;padding-right:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:13px;font-weight:500;padding:5px 12px;border-radius:999px;cursor:pointer;min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 12px 12px 16px}
.toggle{appearance:none;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:0;min-width:0;display:flex;flex-direction:column;gap:2px}
.song{font-size:12px;color:var(--muted);font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.genre{font-weight:700;font-size:16px;line-height:1.35}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:500}
.mix{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.mix.cand{background:transparent;border:1px dashed var(--accent)}
.quick{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{appearance:none;font:inherit;font-size:13px;font-weight:700;border-radius:8px;padding:7px 12px;cursor:pointer;min-height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.body{border-top:1px solid var(--line);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.field-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
pre.code{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.notes{margin:0;padding-left:1.1em;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.notes code{font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:0 4px;border-radius:4px;color:var(--ink)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty p{margin:0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
label.lbl{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
select{min-height:44px}
textarea{font-family:var(--f-body);font-size:15px;line-height:1.7;min-height:220px;resize:vertical}
textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.opts{display:flex;flex-wrap:wrap;gap:8px 18px}
.opts label{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer;min-height:32px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--warn)}
.picked{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px}
.picked b{color:var(--ink)}
.out{white-space:pre-wrap;font-family:var(--f-body);font-size:15px;line-height:1.75;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-height:120px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.gen{background:var(--accent-soft);border-color:var(--accent)}
@media (max-width:620px){.card-head{grid-template-columns:1fr}.quick{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>

<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);

const $ = s => document.querySelector(s);
const store = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cat = store.get('cat','すべて'); if(!CATS.includes(cat)) cat='すべて';
const generated = [];
const open = new Set();

/* ---------- copy ---------- */
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1600)}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok}
function copy(text,label){
  const done=()=>toast(label+'をコピーしました');
  const fail=()=>{ if(fallbackCopy(text)) done(); else toast('コピーできませんでした。テキストを選択してコピーしてください'); };
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,fail); return; } }catch(e){}
  fail();
}

/* ---------- search ---------- */
const norm = s => (s||'').toLowerCase().normalize('NFKC').replace(/[・\-‐―ー\s／/、,]/g,'');
function hay(e){return norm([e.song,e.genre,e.cat,e.group,e.mix,e.style,(e.notes||[]).join(' ')].join(' '))}
DATA.forEach(e=>e._h=hay(e));
function matches(e,q){ if(!q) return true; return q.split(/\s+/).filter(Boolean).every(t=>e._h.includes(norm(t))); }

/* ---------- render ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function noteHTML(n){return esc(n).replace(/`([^`]+)`/g,'<code>$1</code>')}
function renderChips(){
  $('#chips').innerHTML = CATS.map(c=>{
    const n = c==='すべて'?DATA.length:DATA.filter(e=>e.cat===c).length;
    if(!n) return '';
    return `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===cat}">${esc(c)} <span style="opacity:.6">${n}</span></button>`;
  }).join('');
}
function card(e,isGen){
  const mix = e.mix ? `<span class="mix ${e.mixStatus==='候補'?'cand':''}" title="ミックス名（${esc(e.mixStatus)}）">${esc(e.mix)}</span>` : '';
  const isOpen = open.has(e.id);
  return `<article class="card ${isGen?'gen':''}" data-id="${e.id}">
    <div class="card-head">
      <button class="toggle" aria-expanded="${isOpen}" aria-controls="b-${e.id}">
        <span class="song">${esc(e.song)} <span class="tag">${esc(e.cat)}</span>${mix}</span>
        <span class="genre">${esc(e.genre)}</span>

      <div class="quick">
        <button class="btn primary" data-copy="style">Style をコピー</button>
        <button class="btn" data-copy="exclude">Exclude をコピー</button>
      </div>
    </div>
    <div class="body" id="b-${e.id}" ${isOpen?'':'hidden'}>

    </div>
  </article>`;
}
function render(){
  const q = $('#q').value.trim();
  const items = DATA.filter(e=>(cat==='すべて'||e.cat===cat)&&matches(e,q));
  const gens = generated.filter(e=>matches(e,q)||true);
  $('#count').textContent = items.length+' 件';
  let html = gens.map(e=>card(e,true)).join('') + items.map(e=>card(e,false)).join('');
  if(!items.length){
    html += `<div class="empty"><p>${q?`「${esc(q)}」に合う曲調はまだ作っていません。`:'この絞り込みに合う曲調はありません。'}</p></div>`;
  }
  $('#list').innerHTML = html;
}
function byId(id){return DATA.find(e=>e.id===id)||generated.find(e=>e.id===id)}

$('#chips').addEventListener('click',ev=>{const b=ev.target.closest('.chip');if(!b)return;cat=b.dataset.cat;store.set('cat',cat);renderChips();render()});
$('#q').addEventListener('input',render);
$('#list').addEventListener('click',ev=>{
  const art = ev.target.closest('.card');
  const cp = ev.target.closest('[data-copy]');
  if(cp&&art){const e=byId(art.dataset.id);copy(e[cp.dataset.copy],cp.dataset.copy==='style'?'Style':'Exclude');return}
  const tg = ev.target.closest('.toggle');
  if(tg&&art){const id=art.dataset.id;open.has(id)?open.delete(id):open.add(id);const body=art.querySelector('.body');body.hidden=!open.has(id);tg.setAttribute('aria-expanded',open.has(id));return}
});

/* ---------- boot ---------- */
renderChips(); render();
})();
</script>

</body>
</html>
